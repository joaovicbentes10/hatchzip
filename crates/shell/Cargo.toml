[package]
name = "hatchzip-shell"
description = "Adds HatchZip to the file manager's right-click menu on Windows and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
# Puts the menu on RAR archives too. Only for builds that can extract them.
rar = []

[dependencies]
anyhow.workspace = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
# Registers the Windows 11 menu's identity package; already in the tree
# through winit and rfd, at this version.
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile.workspace = true

[target."cfg(windows)".dev-dependencies]
winreg = "0.56.0"
